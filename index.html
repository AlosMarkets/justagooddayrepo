<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today is a Good Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(to bottom right, #f0f9ff, #fff5f2, #fff7ed);
            --text-main: #1e293b;
            --text-muted: #475569;
            --glass-bg: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.3);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(to bottom right, #0f172a, #1e1b4b, #2e1065);
                --text-main: #f1f5f9;
                --text-muted: #cbd5e1;
                --glass-bg: rgba(0, 0, 0, 0.3);
                --glass-border: rgba(255, 255, 255, 0.1);
            }
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            transition: background 0.5s ease, color 0.5s ease;
        }
        .serif {
            font-family: 'Playfair Display', serif;
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
        }
        .text-muted {
            color: var(--text-muted);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">

    <main class="max-w-2xl px-6 text-center">
        <h1 class="serif text-6xl md:text-8xl mb-6 animate-fade-in">
            Today is a <br>
            <span class="italic text-orange-500 dark:text-orange-400">good day.</span>
        </h1>
        
        <p class="text-lg md:text-xl text-muted mb-12 leading-relaxed">
            Take a deep breath. You're doing better than you think. 
            What's one small thing you're grateful for right now?
        </p>

        <div class="glass p-8 rounded-3xl shadow-xl">
            <p class="italic text-lg">
                "The sun is up, the sky is blue, it's beautiful, and so are you."
            </p>
            <div class="mt-6 flex justify-center gap-4">
                <button class="bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-8 py-3 rounded-full hover:opacity-80 transition-all font-medium shadow-lg">
                    Spread the Joy
                </button>
            </div>
        </div>
    </main>

    <footer class="absolute bottom-8 text-slate-400 dark:text-slate-500 text-sm">
        &copy; 2023 • Keep breathing, keep growing.
    </footer>

</body>
</html>
