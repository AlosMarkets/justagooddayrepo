<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today is a Good Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .serif {
            font-family: 'Playfair Display', serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-peach-50 to-orange-50 min-h-screen flex flex-col items-center justify-center text-slate-800">

    <main class="max-w-2xl px-6 text-center">
        <h1 class="serif text-6xl md:text-8xl mb-6 animate-fade-in">
            Today is a <br>
            <span class="italic text-orange-500">good day.</span>
        </h1>
        
        <p class="text-lg md:text-xl text-slate-600 mb-12 leading-relaxed">
            Take a deep breath. You're doing better than you think. 
            What's one small thing you're grateful for right now?
        </p>

        <div class="glass p-8 rounded-3xl shadow-xl">
            <p class="italic text-slate-700 text-lg">
                "The sun is up, the sky is blue, it's beautiful, and so are you."
            </p>
            <div class="mt-6 flex justify-center gap-4">
                <button class="bg-slate-900 text-white px-8 py-3 rounded-full hover:bg-slate-700 transition-all font-medium shadow-lg">
                    Spread the Joy
                </button>
            </div>
        </div>
    </main>

    <footer class="absolute bottom-8 text-slate-400 text-sm">
        &copy; 2023 • Keep breathing, keep growing.
    </footer>

</body>
</html>
